# World Cup 2026 stack: postgres + aegean-consensus + AegeanBench reporter.
#
# Layout assumes aegean-consensus checkout is at ../aegean-consensus
# (sibling directory). Each service reads its OWN .env file:
#   ../aegean-consensus/.env  -> LLM keys, agent models, postgres URL
#   ./.env                    -> sports data keys, internal URLs
#
# Usage:
#   docker compose up -d --build
#
# Public ingress: only port 8200 (AegeanBench reporter).
# aegean-consensus runs on port 8000 INTERNAL to the docker network.

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegean-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegean
      POSTGRES_DB: aegean
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegean_secret}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegean -d aegean"]
      interval: 10s
      timeout: 5s
      retries: 5

  aegean-consensus:
    build:
      context: ../aegean-consensus
      dockerfile: Dockerfile
    image: aegean-consensus:worldcup-2026
    container_name: aegean-consensus
    restart: unless-stopped
    env_file:
      - ../aegean-consensus/.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  aegeanbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegeanbench:worldcup-2026
    container_name: aegeanbench
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      aegean-consensus:
        condition: service_healthy
    environment:
      # Override the internal URL even if .env points elsewhere
      AEGEAN_CONSENSUS_URL: http://aegean-consensus:8000
      PYTHONPATH: /app
    ports:
      - "8200:8200"
    volumes:
      - ./data/runs:/root/.aegeanbench/worldcup_runs
      - ./data/cache:/root/.aegeanbench/sports_cache
      - ./data/kaggle:/root/.aegeanbench/kaggle
      - ./data/prompts:/root/.aegeanbench/prompts
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8200/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: aegean-worldcup
