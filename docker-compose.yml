version: "3.9"

# World Cup 2026 stack: aegean-consensus (port 8000, internal) +
# AegeanBench reporter (port 8200, public). The reporter calls
# consensus over the internal docker network.
#
# Usage:
#   cp docs/.env.example .env
#   docker-compose up -d
#
# Layout assumes aegean-consensus checkout is at ../aegean-consensus
# (sibling directory). Adjust the build.context if yours is elsewhere.

services:
  aegean-consensus:
    build:
      context: ../aegean-consensus
      dockerfile: Dockerfile
    image: aegean-consensus:worldcup-2026
    container_name: aegean-consensus
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-7}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AEGEAN_AGENT_COUNT: "7"
      AEGEAN_QUORUM_SIZE: "2"
      AEGEAN_STABILITY_HORIZON: "2"
      AEGEAN_MAX_ROUNDS: "5"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  aegeanbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegeanbench:worldcup-2026
    container_name: aegeanbench
    restart: unless-stopped
    depends_on:
      aegean-consensus:
        condition: service_healthy
    environment:
      # AegeanBench -> aegean-consensus over the internal network
      AEGEAN_CONSENSUS_URL: http://aegean-consensus:8000

      # LLM keys (predictors fall back to mock when absent)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}

      # Data sources (each falls back to mock when absent)
      AEGEANBENCH_FOOTBALL_DATA_KEY: ${AEGEANBENCH_FOOTBALL_DATA_KEY}
      AEGEANBENCH_SOCCERSAPI_KEY: ${AEGEANBENCH_SOCCERSAPI_KEY}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      FBREF_LIVE: ${FBREF_LIVE:-0}

      # Chat service (V2)
      CHAT_SERVICE_URL: ${CHAT_SERVICE_URL:-http://chat-service:9100}

      # Misc
      PYTHONPATH: /app
    ports:
      - "8200:8200"
    volumes:
      - ./data/runs:/root/.aegeanbench/worldcup_runs
      - ./data/cache:/root/.aegeanbench/sports_cache
      - ./data/kaggle:/root/.aegeanbench/kaggle
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8200/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: aegean-worldcup
